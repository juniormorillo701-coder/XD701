<!doctype html>

<style>

  #sub { top: 320px; font-size: 56px; color: #9ff3ea; text-shadow: 0 6px 20px rgba(0,0,0,.7); }
  .tag { position: absolute; padding: 22px 38px 22px 28px; border-radius: 60px; font-size: 52px;
         font-family: "DejaVu Sans", sans-serif; font-weight: bold; color: #fff; opacity: 0;
         background: rgba(15, 25, 40, .72); border: 4px solid #39e0cf; box-shadow: 0 0 40px rgba(57,224,207,.35); }
  .tag b { display: inline-block; width: 62px; height: 62px; line-height: 62px; border-radius: 50%; margin-right: 22px;
           background: #39e0cf; color: #061418; text-align: center; font-size: 44px; vertical-align: middle; }
  #denied { top: 330px; font-size: 112px; color: #ff3344; text-shadow: 0 0 40px rgba(255,40,60,.8), 0 6px 0 #000; }

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const W = 1080, H = 1920;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.insertBefore(renderer.domElement, document.getElementById('headline'));
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(35, W / H, 0.1, 200);

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const easeIO = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const back = x => { x = clamp(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const V = (x, y, z) => new THREE.Vector3(x, y, z);
function canvasTex(size, draw) {
  const c = document.createElement('canvas'); c.width = c.height = size; draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const std = (o) => new THREE.MeshStandardMaterial(o);
const phys = (o) => new THREE.MeshPhysicalMaterial(o);

// ---------- materials ----------
const chrome = std({ color: 0xffffff, metalness: 1, roughness: 0.12 });
const satin = std({ color: 0xd8dce2, metalness: 1, roughness: 0.32 });
const blackBody = phys({ color: 0x0c0d10, metalness: 0.2, roughness: 0.38, clearcoat: 1, clearcoatRoughness: 0.18 });
const fpTex = canvasTex(512, (g, s) => {
  g.fillStyle = '#05080a'; g.fillRect(0, 0, s, s);
  g.strokeStyle = '#ffffff'; g.lineWidth = 11; g.lineCap = 'round';
  for (let i = 0; i < 9; i++) {
    const r = 28 + i * 24, gap = 0.35 + (i % 3) * 0.25;
    g.beginPath(); g.ellipse(s / 2, s / 2 + 30, r * 0.82, r, 0, Math.PI + gap, 2 * Math.PI + Math.PI - gap * 0.6); g.stroke();
  }
});
const fpMat = std({ color: 0x111111, map: fpTex, emissive: 0x2fe0d0, emissiveMap: fpTex, emissiveIntensity: 0.35, roughness: 0.25 });
const ledMat = std({ color: 0x0a0a0a, emissive: 0x22ff66, emissiveIntensity: 0.6 });

// ---------- padlock ----------
function makeLock() {
  const root = new THREE.Group(), inner = new THREE.Group(); root.add(inner); inner.position.y = -1.0;
  const body = new THREE.Mesh(new RoundedBoxGeometry(2.4, 2.2, 1.0, 6, 0.16), blackBody); inner.add(body);
  const base = new THREE.Mesh(new RoundedBoxGeometry(2.3, 0.2, 0.95, 4, 0.06), satin); base.position.y = -1.18; inner.add(base);
  const frame = new THREE.Mesh(new RoundedBoxGeometry(0.78, 0.78, 0.08, 4, 0.08), chrome); frame.position.set(0, -0.35, 0.49); inner.add(frame);
  const fp = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 0.6), fpMat); fp.position.set(0, -0.35, 0.535); inner.add(fp);
  const led = new THREE.Mesh(new THREE.SphereGeometry(0.045, 16, 12), ledMat); led.position.set(0, 0.3, 0.5); inner.add(led);
  // arco: pivota sobre la pata derecha (x = +0.78)
  const pivot = new THREE.Group(); pivot.position.set(0.78, 0, 0); inner.add(pivot);
  const R = 0.78, r = 0.16;
  class ShacklePath extends THREE.Curve {
    getPoint(t, o = new THREE.Vector3()) {
      const L = 1.25, arc = Math.PI * R, tot = 2 * L + arc, d = t * tot;
      if (d < L) return o.set(-R, 0.95 + d, 0);
      if (d < L + arc) { const a = Math.PI - (d - L) / R; return o.set(R * Math.cos(a), 0.95 + L + R * Math.sin(a), 0); }
      return o.set(R, 0.95 + L - (d - L - arc), 0);
    }
  }
  const sh = new THREE.Mesh(new THREE.TubeGeometry(new ShacklePath(), 140, r, 24, false), chrome);
  sh.position.x = -0.78; pivot.add(sh);
  const glow = new THREE.Mesh(new THREE.PlaneGeometry(0.62, 0.05), new THREE.MeshBasicMaterial({ color: 0x8ffff4, transparent: true, opacity: 0, blending: THREE.AdditiveBlending }));
  glow.position.set(0, -0.35, 0.545); inner.add(glow);
  root.userData = { pivot, glow, inner };
  return root;
}
function setShackle(lock, open) {   // open 0..1 (sube y luego gira)
  const { pivot } = lock.userData;
  pivot.position.y = 0.5 * ease(open * 2.2);
  pivot.rotation.y = -1.9 * easeIO((open - 0.3) / 0.7);
}

// ---------- shared stage ----------
const stage = new THREE.Group(); scene.add(stage);
const floorTex = canvasTex(512, (g, s) => {
  const gr = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, s, s);
});
const floor = new THREE.Mesh(new THREE.CircleGeometry(9, 64), std({ color: 0x14161c, roughness: 0.35, metalness: 0.4, transparent: true, alphaMap: floorTex }));
floor.rotation.x = -Math.PI / 2; floor.position.y = -2.27; stage.add(floor);
const shadowTex = canvasTex(256, (g, s) => {
  const gr = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  gr.addColorStop(0, 'rgba(0,0,0,.85)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, s, s);
});
const shadow = new THREE.Mesh(new THREE.PlaneGeometry(4.2, 2.4), new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false }));
shadow.rotation.x = -Math.PI / 2; shadow.position.y = -2.255; stage.add(shadow);
const ring = new THREE.Mesh(new THREE.RingGeometry(0.9, 1.0, 96), new THREE.MeshBasicMaterial({ color: 0x7ff6ff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, side: THREE.DoubleSide }));
ring.rotation.x = -Math.PI / 2; ring.position.y = -2.24; stage.add(ring);
const podium = new THREE.Group(); stage.add(podium);
const podBase = new THREE.Mesh(new THREE.CylinderGeometry(2.3, 2.45, 0.6, 96), std({ color: 0x1a1c22, roughness: 0.3, metalness: 0.6 }));
podBase.position.set(0, -2.57, 0); podium.add(podBase);
const podRing = new THREE.Mesh(new THREE.TorusGeometry(2.33, 0.05, 12, 120), std({ color: 0x000000, emissive: 0xff8a2a, emissiveIntensity: 3 }));
podRing.rotation.x = Math.PI / 2; podRing.position.y = -2.27; podium.add(podRing);
const lock = makeLock(); stage.add(lock);

// lights
scene.add(new THREE.AmbientLight(0xffffff, 0.25));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(4, 6, 8); scene.add(key);
const rimA = new THREE.PointLight(0x33ddff, 60, 30); rimA.position.set(-5, 3, -3); scene.add(rimA);
const rimB = new THREE.PointLight(0xff7a33, 60, 30); rimB.position.set(5, 2, -3); scene.add(rimB);

// glove
const glove = new THREE.Group(); scene.add(glove);
{
  const gm = std({ color: 0x18181b, roughness: 0.75, metalness: 0.05 });
  const palm = new THREE.Mesh(new RoundedBoxGeometry(1.5, 0.8, 1.9, 5, 0.35), gm); palm.position.set(0, 0, 1.45); glove.add(palm);
  const finger = new THREE.Mesh(new THREE.CapsuleGeometry(0.2, 1.0, 8, 16), gm); finger.rotation.x = Math.PI / 2; finger.position.set(0, 0.05, 0.25); glove.add(finger);
  for (let i = 0; i < 3; i++) {
    const f = new THREE.Mesh(new THREE.CapsuleGeometry(0.19, 0.5, 8, 16), gm); f.rotation.x = Math.PI / 2.4; f.position.set(-0.45 + i * 0.4 + 0.2, -0.28, 0.55); glove.add(f);
  }
  const cuff = new THREE.Mesh(new THREE.CylinderGeometry(0.75, 0.8, 0.7, 32), std({ color: 0x2a2a30, roughness: 0.6 })); cuff.rotation.x = Math.PI / 2; cuff.position.z = 2.6; glove.add(cuff);
}

// ---------- places: lockers / backpack / suitcase ----------
const places = new THREE.Group(); scene.add(places);
const lockerRow = new THREE.Group(); places.add(lockerRow);
{
  const lm = std({ color: 0x5d6f86, metalness: 0.65, roughness: 0.38 });
  const dark = std({ color: 0x1b2028, roughness: 0.6 });
  for (let i = -4; i <= 4; i++) {
    const g = new THREE.Group(); g.position.x = i * 1.75;
    g.add(new THREE.Mesh(new RoundedBoxGeometry(1.68, 6.4, 1.6, 3, 0.05), lm));
    for (let k = 0; k < 5; k++) { const v = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.07, 0.05), dark); v.position.set(0, 2.5 - k * 0.2, 0.8); g.add(v); }
    for (let k = 0; k < 5; k++) { const v = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.07, 0.05), dark); v.position.set(0, -2.0 - k * 0.2, 0.8); g.add(v); }
    const hasp = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.5, 0.1), satin); hasp.position.set(0.55, 0.3, 0.84); g.add(hasp);
    lockerRow.add(g);
  }
  const fl = new THREE.Mesh(new THREE.PlaneGeometry(40, 20), std({ color: 0x23262d, roughness: 0.5, metalness: 0.2 }));
  fl.rotation.x = -Math.PI / 2; fl.position.set(0, -3.2, 4); lockerRow.add(fl);
  lockerRow.position.set(0, 0, -1.2);
}
const backpack = new THREE.Group(); places.add(backpack);
{
  const bm = std({ color: 0xc0392b, roughness: 0.8 });
  backpack.add(new THREE.Mesh(new RoundedBoxGeometry(3.0, 4.0, 1.6, 6, 0.6), bm));
  const pocket = new THREE.Mesh(new RoundedBoxGeometry(2.2, 1.6, 0.6, 5, 0.25), std({ color: 0xa93226, roughness: 0.8 })); pocket.position.set(0, -0.9, 0.85); backpack.add(pocket);
  const zip = new THREE.Mesh(new THREE.TorusGeometry(1.25, 0.04, 8, 64, Math.PI), std({ color: 0x222222, roughness: 0.5 })); zip.position.set(0, 0.55, 0.81); backpack.add(zip);
  const handle = new THREE.Mesh(new THREE.TorusGeometry(0.45, 0.09, 12, 32, Math.PI), std({ color: 0x222222 })); handle.position.set(0, 2.0, 0); backpack.add(handle);
}
const suitcase = new THREE.Group(); places.add(suitcase);
{
  const sm = phys({ color: 0x1f8f8a, roughness: 0.25, metalness: 0.2, clearcoat: 1 });
  suitcase.add(new THREE.Mesh(new RoundedBoxGeometry(3.2, 4.6, 1.6, 6, 0.3), sm));
  for (let k = -1; k <= 1; k++) { const rib = new THREE.Mesh(new RoundedBoxGeometry(0.22, 4.3, 0.12, 3, 0.05), sm); rib.position.set(k * 0.9, 0, 0.82); suitcase.add(rib); }
  const seam = new THREE.Mesh(new THREE.BoxGeometry(3.25, 0.06, 1.65), std({ color: 0x111111 })); seam.position.y = 0; suitcase.add(seam);
  const h = new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.1, 12, 32, Math.PI), std({ color: 0x222222 })); h.position.set(0, 2.3, 0); suitcase.add(h);
  for (const x of [-1.2, 1.2]) { const w = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.2, 24), std({ color: 0x111111 })); w.rotation.z = Math.PI / 2; w.position.set(x, -2.5, 0.4); suitcase.add(w); }
}
const miniLock = makeLock(); places.add(miniLock);

// ---------- DOM ----------
const $ = id => document.getElementById(id);
const bg = $('bg'), headline = $('headline'), sub = $('sub'), flash = $('flash');
const BGS = {
  drop: ['#1a1f2e', '#05060a'], scan: ['#0d2a33', '#04080c'], spin: ['#161a2c', '#05060a'],
  places: ['#2b3140', '#0b0d12'], denied: ['#3a0a10', '#07020a'], cta: ['#ff8a3d', '#7a1f3d'],
};
function show(el, a, y = 0, s = 1) { el.style.opacity = a; el.style.transform = `translateY(${y}px) scale(${s})`; }
function hideAll() { for (const id of ['headline', 'sub', 't1', 't2', 't3', 'denied', 'price', 'code', 'bio']) show($(id), 0); }

// ---------- timeline ----------
let TL = null;
window.setup = tl => { TL = tl; if (tl.ring) podRing.material.emissive.set(tl.ring); };
const T = (k, d) => (TL.text && TL.text[k]) || d;
function sceneAt(t) {
  for (const s of TL.scenes) if (t < s.start + s.dur) return s;
  return TL.scenes[TL.scenes.length - 1];
}
window.renderAt = function (t) {
  const S = sceneAt(t), lt = t - S.start, D = S.dur, k = S.key;
  hideAll();
  const bgc = (TL.bg && TL.bg[k]) || BGS[k];
  bg.style.background = `radial-gradient(ellipse at 50% 42%, ${bgc[0]} 0%, ${bgc[1]} 75%)`;
  stage.visible = k !== 'places'; places.visible = k === 'places'; glove.visible = k === 'denied';
  podium.visible = k === 'cta'; ring.material.opacity = 0;
  lock.position.set(0, 0, 0); lock.rotation.set(0, 0, 0); lock.scale.setScalar(1); setShackle(lock, 0);
  fpMat.emissive.set(0x2fe0d0); fpMat.emissiveIntensity = 0.35; ledMat.emissive.set(0x22ff66); ledMat.emissiveIntensity = 0.6;
  lock.userData.glow.material.opacity = 0;
  rimA.color.set(TL.rim ? TL.rim[0] : 0x33ddff); rimB.color.set(TL.rim ? TL.rim[1] : 0xff7a33);
  let cam = V(0, 0.8, 12), look = V(0, 0.2, 0);

  if (k === 'drop') {
    const fall = clamp(lt / 0.55);
    let y = lerp(10, 0, fall * fall);
    if (lt > 0.55) y = Math.abs(Math.sin((lt - 0.55) * 9)) * 0.35 * Math.exp(-(lt - 0.55) * 6);
    lock.position.y = y; lock.rotation.y = 0.55 - 0.15 * ease(lt / 2.5); lock.rotation.z = (1 - fall) * 0.25;
    const shake = lt > 0.55 ? Math.sin(lt * 70) * 0.12 * Math.exp(-(lt - 0.55) * 7) : 0;
    cam = V(shake, 0.9 + shake, 12.5 - lt * 0.5); look = V(0, 0.3, 0);
    if (lt > 0.55) { const r = (lt - 0.55); ring.scale.setScalar(1 + r * 6); ring.material.opacity = Math.max(0, 0.9 - r * 1.1); }
    shadow.material.opacity = clamp(1 - y / 6);
    if (lt > 0.6) show(headline, ease((lt - 0.6) / 0.25), 0, lerp(1.4, 1, back((lt - 0.6) / 0.35))), headline.innerHTML = T('drop', 'NO KEYHOLE.');
  }
  if (k === 'scan') {
    const sp = V(0, -1.35, 0);
    const pin = easeIO(lt / 1.0), out = easeIO((lt - 2.3) / 1.0);
    cam = V(lerp(1.5, 0, pin), lerp(0.8, -1.1, pin), lerp(11, 3.6, pin));
    look = V(0, lerp(0.2, -1.3, pin), 0);
    if (lt > 2.3) { cam = V(lerp(0, 3.2, out), lerp(-1.1, 1.2, out), lerp(3.6, 11.5, out)); look = V(0, lerp(-1.3, 0.6, out), 0); }
    lock.rotation.y = lerp(0.4, 0, pin) + (lt > 2.3 ? -0.5 * out : 0);
    const sc = clamp((lt - 1.0) / 0.9);
    if (lt > 1.0 && lt < 2.0) { const g = lock.userData.glow; g.material.opacity = 0.9; g.position.y = -0.35 + 0.28 - sc * 0.56; }
    fpMat.emissiveIntensity = 0.35 + 2.2 * Math.sin(Math.PI * sc);
    if (lt > 1.9) { ledMat.emissiveIntensity = 4; fpMat.emissive.set(0x33ff88); fpMat.emissiveIntensity = Math.max(0.5, 2.5 - (lt - 1.9) * 2); }
    setShackle(lock, clamp((lt - 2.1) / 0.8));
    show(headline, ease((lt - 2.2) / 0.3), 0, lerp(1.3, 1, back((lt - 2.2) / 0.4))); headline.innerHTML = T('scan', 'TOUCH. OPEN.');
    rimA.color.set(0x2fe0d0);
  }
  if (k === 'spin') {
    setShackle(lock, 1 - clamp(lt / 0.45));
    lock.rotation.y = -0.5 + lt / D * Math.PI * 2 * 0.9;
    lock.position.y = 0.6 + Math.sin(lt * 2) * 0.12;
    cam = V(0, 1.4, 13.5); look = V(0, -0.9, 0);
    shadow.material.opacity = 0.7;
    const tags = [['t1', 0.5], ['t2', 1.5], ['t3', 2.6]];
    for (const [id, st] of tags) { const e = ease((lt - st) / 0.35); show($(id), e, (1 - e) * 60, lerp(0.8, 1, back((lt - st) / 0.4))); }
    rimA.position.set(Math.cos(lt) * -6, 3, Math.sin(lt) * -4); rimB.position.set(Math.cos(lt) * 6, 2, Math.sin(lt) * 4 - 3);
  }
  if (k === 'places') {
    const part = Math.min(2, Math.floor(lt / (D / 3))), pt = lt - part * D / 3, pd = D / 3;
    lockerRow.visible = part === 0; backpack.visible = part === 1; suitcase.visible = part === 2;
    const pop = back((pt - 0.12) / 0.35); miniLock.scale.setScalar(Math.max(0.001, 0.32 * pop));
    setShackle(miniLock, 0); miniLock.rotation.set(0, 0, 0);
    const names = ['GYM LOCKER', 'BACKPACK', 'SUITCASE'];
    headline.innerHTML = names[part]; show(headline, ease(pt / 0.25), (1 - ease(pt / 0.25)) * -40);
    if (part === 0) {
      miniLock.position.set(0.55, 0.0, 0.0); miniLock.rotation.y = 0;
      cam = V(lerp(-6, 1.0, easeIO(pt / pd)), 0.6, lerp(11, 7.5, easeIO(pt / pd))); look = V(0.4, -0.3, -1);
    } else if (part === 1) {
      backpack.position.set(0, 0, 0); backpack.rotation.y = lerp(-0.5, 0.25, easeIO(pt / pd));
      miniLock.position.set(0.55, 0.65, 1.0).applyAxisAngle(V(0, 1, 0), backpack.rotation.y); miniLock.rotation.y = backpack.rotation.y;
      cam = V(0, 1.2, lerp(12, 10, easeIO(pt / pd))); look = V(0, 0.2, 0);
    } else {
      suitcase.position.set(0, 0, 0); suitcase.rotation.y = lerp(0.5, -0.25, easeIO(pt / pd));
      miniLock.position.set(0.3, 0.2, 0.95).applyAxisAngle(V(0, 1, 0), suitcase.rotation.y); miniLock.rotation.y = suitcase.rotation.y;
      cam = V(0, 1.0, lerp(12.5, 10.5, easeIO(pt / pd))); look = V(0, 0.2, 0);
    }
  }
  if (k === 'denied') {
    cam = V(1.4, 0.2, 11); look = V(0, -0.1, 0); lock.rotation.y = 0.12;
    const appr = easeIO(lt / 1.2), ret = easeIO((lt - 2.1) / 0.6);
    const tip = V(0, -1.35, 0.75), startP = V(3.5, -4.5, 5);
    const dir = startP.clone().sub(tip).normalize();          // del sensor hacia afuera
    const dist = lerp(9, 0, appr) + ret * 9;
    glove.position.copy(tip).addScaledVector(dir, 0.55 + dist);
    glove.lookAt(glove.position.clone().add(dir));            // +z hacia afuera => el dedo (-z) apunta al sensor
    if (lt > 1.25 && lt < 2.3) {
      const blink = (Math.floor((lt - 1.25) * 8) % 2) === 0;
      fpMat.emissive.set(0xff2233); fpMat.emissiveIntensity = blink ? 3 : 1.2;
      ledMat.emissive.set(0xff2233); ledMat.emissiveIntensity = 4;
      lock.position.x = Math.sin(lt * 60) * 0.12 * (1 - clamp((lt - 1.25) / 0.8));
      rimA.color.set(0xff2233); rimB.color.set(0xff2233);
    }
    if (lt > 1.3) { const e = ease((lt - 1.3) / 0.2); show($('denied'), e, 0, lerp(1.5, 1, back((lt - 1.3) / 0.3))); $('denied').style.transform += ` translateX(${(lt < 1.7 ? Math.sin(lt * 90) * 14 : 0)}px)`; }
    headline.innerHTML = T('denied', 'ANYONE ELSE?'); show(headline, ease((lt - 0.2) / 0.3));
  }
  if (k === 'cta') {
    lock.rotation.y = lt * 0.9; lock.position.y = 0.15;
    cam = V(Math.sin(lt * 0.25) * 2, lerp(2.6, 1.8, ease(lt / 3)), lerp(18, 16.5, ease(lt / 3))); look = V(0, -0.8, 0);
    podRing.material.emissiveIntensity = 2.5 + Math.sin(lt * 4) * 0.8;
    shadow.material.opacity = 0.6; rimA.color.set(0xffd27a);
    headline.innerHTML = T('cta', 'GET YOURS'); show(headline, ease((lt - 0.1) / 0.3));
    const pe = ease((lt - 0.5) / 0.3); show($('price'), pe, 0, lerp(1.6, 1, back((lt - 0.5) / 0.4)) * (1 + 0.03 * Math.sin(lt * 6)));
    const ce = ease((lt - 2.1) / 0.3); show($('code'), ce, (1 - ce) * 50);
    const be = ease((lt - 4.0) / 0.3); show($('bio'), be, Math.sin(lt * 6) * 8 * be);
  }
  // flash corto en cada cambio de escena
  flash.style.opacity = (S !== TL.scenes[0] && lt < 0.18) ? (1 - lt / 0.18) * 0.55 : 0;
  camera.position.copy(cam); camera.lookAt(look);
  renderer.render(scene, camera);
};
window.ready = true;
</script>
